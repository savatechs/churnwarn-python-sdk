name: Publish to PyPI

# Lives in the standalone churnwarn-python-sdk repo (mirrored from the private monorepo).
# GitHub-hosted runners are free & unlimited for public repos, so runs-on: ubuntu-latest.
#
# Release by pushing a version tag whose version matches pyproject.toml:
#   git tag v0.1.1 && git push origin v0.1.1
#
# Required repo secret: PYPI_API_TOKEN  (pypi.org token, value starts with "pypi-")
# Alternative: PyPI Trusted Publishing (OIDC, no stored token) — see sdks/PUBLISHING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG_VERSION pyproject=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match pyproject version ($PKG_VERSION). Bump the version and re-tag."
            exit 1
          fi

      - name: Install and test
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e '.[dev]'
          python -m pytest -q

      - name: Build and check
        run: |
          rm -rf dist
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        run: twine upload dist/* -u __token__ -p "$PYPI_TOKEN"
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
