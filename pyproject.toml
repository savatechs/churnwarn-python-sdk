[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-warn-sdk"
version = "0.1.0"
description = "Async HTTP client for ChurnWarn Gateway event APIs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "savatechs", email = "amirh.esmail.zade@gmail.com" }]
keywords = ["churn", "analytics", "telemetry", "events", "churnwarn"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/savatechs/churnwarn-python-sdk#readme"
Repository = "https://github.com/savatechs/churnwarn-python-sdk"
Issues = "https://github.com/savatechs/churnwarn-python-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churn_warn_sdk = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# "." makes a `tests` package importable (the `pytest` console script does NOT
# add cwd to sys.path, unlike `python -m pytest`). "src" lets the suite run
# against the source tree even without an editable install.
pythonpath = [".", "src"]
